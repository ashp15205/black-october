name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -W error::ResourceWarning -m unittest tests.test_scripts -v
      - run: python tests/mutation_check.py
      - run: python evals/run_evals.py
      - run: python scripts/quick_validate.py
      - name: Dogfood scan (repo must be clean of HIGH+ findings)
        run: python skills/security-config-code-review/scripts/scan.py . --exclude tests --fail-on HIGH
